# 世界树关系概念出站：MSVC 编译 + --verify-relation-concept-nl
# 不启治理外发；不声称用户正式持久库端到端。
name: cloud-relation-concept-nl

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/cloud-relation-concept-nl.yml'
      - 'tools/ci/windows-relation-concept-nl.ps1'
      - '海中鱼巣.vcxproj'
      - '海中鱼巣.vcxproj.filters'
      - '海中鱼巣/领域/关系概念*'
      - '海中鱼巣/业务/初始化.关系概念.*'
      - '海中鱼巣/业务/关系陈述.语言服务.*'
      - '海中鱼巣/业务/自检.关系概念出站.*'
      - '海中鱼巣/装配.普通应用.*'
      - '海中鱼巣/启动.*'
      - '海中鱼巣/启动选项.数据.h'
      - '海中鱼巣/程序运行结果.数据.h'
      - '初始化材料/世界关系概念种子.txt'
  push:
    branches:
      - 'cursor/relation-concept-nl-outbound-c720'
    paths:
      - '.github/workflows/cloud-relation-concept-nl.yml'
      - 'tools/ci/windows-relation-concept-nl.ps1'
      - '海中鱼巣.vcxproj'
      - '海中鱼巣.vcxproj.filters'
      - '海中鱼巣/领域/关系概念*'
      - '海中鱼巣/业务/初始化.关系概念.*'
      - '海中鱼巣/业务/关系陈述.语言服务.*'
      - '海中鱼巣/业务/自检.关系概念出站.*'
      - '海中鱼巣/装配.普通应用.*'
      - '海中鱼巣/启动.*'
      - '海中鱼巣/启动选项.数据.h'
      - '海中鱼巣/程序运行结果.数据.h'
      - '初始化材料/世界关系概念种子.txt'

permissions:
  contents: read

jobs:
  msvc-relation-concept-nl:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: MSVC build + relation-concept verify
        shell: pwsh
        run: |
          ./tools/ci/windows-relation-concept-nl.ps1
